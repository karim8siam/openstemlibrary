<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Page Not Found | OpenSTEM Library</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #080c14; color: #f8fafc; font-family: system-ui, sans-serif; line-height: 1.6; }
    main { width: 100%; max-width: 640px; padding: clamp(24px, 6vw, 48px); background: #0f172a; border: 1px solid #1e293d; border-radius: 18px; }
    .brand { color: #38bdf8; font-weight: 700; text-decoration: none; }
    .code { color: #94a3b8; margin: 32px 0 0; }
    h1 { margin: 4px 0 16px; font-size: clamp(28px, 6vw, 40px); line-height: 1.2; }
    p { color: #cbd5e1; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    nav a { padding: 10px 16px; border: 1px solid #38bdf8; border-radius: 8px; color: #38bdf8; text-decoration: none; }
    nav a:first-child { background: #38bdf8; color: #080c14; font-weight: 700; }
    a:focus-visible { outline: 3px solid #f59e0b; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/">OpenSTEM Library</a>
    <p class="code">404 · Page not found</p>
    <h1>We couldn't find this page.</h1>
    <p>The address may be incorrect, or the page may have moved. Browse the library or search from the homepage to find your textbook.</p>
    <nav aria-label="Return to the library">
      <a href="/">Browse the library</a>
      <a href="/introduction-to-statistics">Introduction to Statistics</a>
    </nav>
  </main>
</body>
</html>
