name: Diagnose Cloudflare production versus deployment
on:
  push:
    branches:
      - 'ops/diagnose-cloudflare-cutover-20261020'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare preview and custom-domain requests
        run: node tooling/check-deployment-provenance.cjs
