<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Luminous Quantum Gradients -->
    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="orbGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Shield/Circle Base -->
  <rect width="100" height="100" rx="24" fill="#0d1424" stroke="#1f2d4d" stroke-width="2"/>

  <!-- Outer Orbit 1: Ellipse at 45 deg -->
  <ellipse cx="50" cy="50" rx="36" ry="14" fill="none" stroke="url(#orbGrad1)" stroke-width="2.5" transform="rotate(45 50 50)" filter="url(#ringGlow)" />
  
  <!-- Outer Orbit 2: Ellipse at -45 deg -->
  <ellipse cx="50" cy="50" rx="36" ry="14" fill="none" stroke="url(#orbGrad2)" stroke-width="2.5" transform="rotate(-45 50 50)" filter="url(#ringGlow)" />

  <!-- Horizontal Wave Ring -->
  <ellipse cx="50" cy="50" rx="38" ry="11" fill="none" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Quantum Wave Superposition Arc -->
  <path d="M 28 50 Q 39 36, 50 50 T 72 50" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" opacity="0.85" />

  <!-- Quantum Nucleus / Particle Core -->
  <circle cx="50" cy="50" r="7.5" fill="url(#coreGrad)" filter="url(#coreGlow)" />
  <circle cx="50" cy="50" r="3" fill="#ffffff" />

  <!-- Orbiting Quantum Particle Dots -->
  <circle cx="73" cy="27" r="3.2" fill="#38bdf8" filter="url(#coreGlow)" />
  <circle cx="27" cy="27" r="3.2" fill="#a78bfa" filter="url(#coreGlow)" />
  <circle cx="65" cy="71" r="2.8" fill="#34d399" filter="url(#coreGlow)" />
</svg>
